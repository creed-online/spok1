# Example:
# - id: tooling-pnpm
#   statement: Uses pnpm, never npm or yarn, for JavaScript projects.
#   scope: global
#   alpha: 9
#   beta: 1
#   impact: 3
#   pinned: true
#   evidence:
#     - {date: 2026-11-26, source: interview, kind: confirm, note: "stated in setup interview"}
#   created: 2026-11-26
#   updated: 2026-11-26

