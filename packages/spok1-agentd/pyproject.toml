[project]
name = "spok1-agentd"
version = "0.0.0"
description = "The always-on spok1 runtime: scheduler, watchers, notifier, governor, approvals, auditor, org, connectors and learning."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Veldray" }]
dependencies = ["spok1-core"]

[project.scripts]
spok1-agentd = "spok1_agentd.__main__:main"

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
spok1-core = { workspace = true }

