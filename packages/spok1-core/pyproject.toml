[project]
name = "spok1-core"
version = "0.0.0"
description = "Shared library for spok1: config, schemas, databases, audit log and vault."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Veldray" }]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

