[project]
name = "spok1-mcp"
version = "0.0.0"
description = "MCP servers for spok1: notify, the custom channel and local connectors."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Veldray" }]
dependencies = ["spok1-core"]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
spok1-core = { workspace = true }

